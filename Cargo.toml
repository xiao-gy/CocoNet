[package]
name = "CocoNet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
authors = ["CocoNet Contributors"]
description = "A decentralized P2P VPN with TUN, dynamic IPAM, relay, and ACL."
repository = ""
readme = "README.md"

[dependencies]
anyhow = "1"
tokio = { version = "1", default-features = false, features = [
	"rt-multi-thread", # multi-threaded runtime
	"macros",          # #[tokio::main]
	"net",             # net types
	"io-util",         # AsyncRead/Write, split, duplex
	"sync",            # mpsc, oneshot, Mutex
	"time",            # delays, intervals
	"process"          # tokio::process::Command
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }
clap = { version = "4", default-features = false, features = ["derive", "std", "help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures = "0.3"
ipnetwork = "0.20"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
igd = "0.12"
mdns = "3.0"
async-trait = "0.1"

# TUN support
# - Non-Windows: use `tun` crate
# - Windows: use `wintun` via wintun.dll

# libp2p stack (minimized feature set)
# Keep only what is used by the code: QUIC transport, relay (client/server),
# kad, ping, identify, gossipsub, autonat, dcutr, dns, mdns, and required
# transports/muxers for relay fallback (tcp, tls, noise, yamux). Drop websocket & request-response.
libp2p = { version = "0.53", default-features = false, features = [
	"macros",
	"identify",
	"ping",
	"kad",
	"relay",
	"autonat",
	"dcutr",
	"dns",
	"tcp",
	"tokio",
	"tls",
	"yamux",
	"noise",
	"quic",
	"gossipsub",
	"mdns",
	"request-response",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tun = { version = "0.6", default-features = false, features = ["async"] }

[target.'cfg(target_os = "windows")'.dependencies]
wintun = "0.4"


[features]
# Enable LAN discovery by default
default = ["mdns"]
mdns = ["libp2p/mdns"]
transport-quic = []
transport-webrtc = []

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
incremental = false
